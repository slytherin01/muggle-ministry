name: Deploy BetaForum to GitHub Pages

on:
  push:
    branches:
      - betaforum-release-candidate
    paths:
      - "portal/betaforum.html"
      - "portal/betaforum.css"
      - "portal/betaforum.js"
      - ".github/workflows/deploy-betaforum-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare BetaForum site
        run: |
          mkdir -p _site
          cp portal/betaforum.html _site/index.html
          cp portal/betaforum.css _site/betaforum.css
          cp portal/betaforum.js _site/betaforum.js
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
