name: BetaForum validation
on:
  push:
    branches:
      - betaforum-release-candidate
    - main
    paths:
      - 'portal/betaforum.js'
      - 'portal/betaforum-embed.js'
      - 'portal/betaforum.html'
      - 'portal/betaforum.css'
      - '.github/workflows/betaforum-validate.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax check
        run: |
          node --check portal/betaforum.js
          node --check portal/betaforum-embed.js
