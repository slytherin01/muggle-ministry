 function switchTab(id){

 }
 function wrap(){

 }

 function renderTranslations(){

 let faqCategories=[],faqArticles=[];

 async function loadFaqAdmin(){
  if(!isAdmin()||!client())return;
  const [cats,articles]=await Promise.all([
   client().from("faq_categories").select("id,name,description,sort_order,is_active").order("sort_order").order("name"),
   client().from("admin_content").select("id,title,body,faq_category_id,published,sort_order,updated_at").eq("kind","faq").order("sort_order").order("created_at",{ascending:false})
  ]);
  if(cats.error||articles.error){faqStatus("FAQ laden mislukt: "+(cats.error||articles.error).message,true);return}
  faqCategories=cats.data||[];faqArticles=articles.data||[];renderFaqAdmin();
 }
 function renderFaqAdmin(){
  const catHost=document.getElementById("hpmwFaqCategoryAdmin"),list=document.getElementById("hpmwFaqArticleList"),filter=document.getElementById("hpmwFaqFilterCategory");

  if(filter){filter.innerHTML='<option value="">Alle categorieën</option>'+faqCategories.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join("");filter.value=selected}

  list.innerHTML=visible.length?visible.map(a=>'<article class="hpmw-admin-news-item"><div><strong>'+esc(a.title)+'</strong><small>'+esc(faqCategories.find(c=>c.id===a.faq_category_id)?.name||"Geen categorie")+' · '+(a.published?"Gepubliceerd":"Concept")+'</small></div><div class="hpmw-admin-row"><button type="button" class="hpmw-manage-btn" data-faq-article-edit="'+a.id+'">Bewerken</button><button type="button" class="hpmw-manage-btn" data-faq-article-delete="'+a.id+'">Verwijderen</button></div></article>').join(""):'<p class="hpmw-admin-muted">Geen FAQ-artikelen in deze selectie.</p>';

 function refreshPreview(){
  const sel=document.getElementById("hpmwRolePreview"),banner=document.getElementById("hpmwRolePreviewStatus");
  if(sel)sel.value=previewRole||"";
  if(banner)banner.textContent=previewRole?tr("previewOn")+previewRole+". "+tr("readOnly"):tr("previewOff");
  body.classList.toggle("hpmw-role-preview-active",!!previewRole);
  body.querySelectorAll("[data-admin-tab],[data-admin-panel]").forEach(el=>{
   const id=el.dataset.adminTab||el.dataset.adminPanel;
   const show=previewRole? (id==="news"?["news_poster","news_poster_supervisor"].includes(previewRole):previewRole==="administrator"):allowed(id);
   el.hidden=!show;
  });
  body.querySelectorAll("button[type=submit],input[type=submit],[data-translation-save],[data-news-edit],[data-news-delete],#hpmwWorkspaceNewsNew,#hpmwTranslationRefresh,#hpmwWorkspaceNewsRefresh").forEach(el=>{el.disabled=!!previewRole});
  if(previewRole&&!allowed(activeTab)){const first=previewRole==="news_poster"||previewRole==="news_poster_supervisor"?"news":null;if(first){activeTab=first;switchTab(first)}}
 }
 body.addEventListener("click",async e=>{
  const tab=e.target.closest("[data-admin-tab]");if(tab){switchTab(tab.dataset.adminTab);return}

  if(e.target.closest("#hpmwFaqNewCategory")){if(isAdmin()&&!previewRole)editFaqCategory();return}
  if(e.target.closest("#hpmwFaqNewArticle")){if(isAdmin()&&!previewRole)editFaqArticle();return}
  if(e.target.closest("#hpmwFaqRefresh")){if(isAdmin()&&!previewRole)await loadFaqAdmin();return}
  if(e.target.closest("#hpmwFaqCategoryCancel")){document.getElementById("hpmwFaqCategoryEditor").innerHTML="";return}

<script id="hpmw-admin-role-visibility-v2">
(()=>{"use strict";
 const btn=document.getElementById("portalManageLaunch");
 const ticketAdmin=document.getElementById("adminLaunch");
 if(!btn)return;
 const access=()=>window.HpmwPortalAccess;
 const currentRole=()=>access()?.role||"guest";

  const ok=permitted();
  btn.hidden=!ok;
  btn.setAttribute("aria-hidden",String(!ok));
  btn.tabIndex=ok?0:-1;
  btn.style.setProperty("display",ok?"inline-flex":"none","important");
  if(ticketAdmin){
   const support=hasSession()&&!!access()?.canSupport?.();

   ticketAdmin.tabIndex=support?0:-1;
   ticketAdmin.style.setProperty("display",support?"inline-flex":"none","important");
  }
  if(!ok){
   const layer=document.getElementById("hpmwManageLayer");
   if(layer?.classList.contains("open")){
    layer.classList.remove("open");
    layer.setAttribute("aria-hidden","true");
   }
  }
 };
 const start=()=>{refresh();};
 document.addEventListener("hpmw:portal-role",refresh);

 btn.addEventListener("click",()=>{if(!permitted()){refresh();return}},{capture:true});

 let tries=0;

})();
</script>
