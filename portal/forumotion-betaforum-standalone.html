argin:0 auto}.muted{color:var(--muted)}.form{display:grid;gap:12px;max-width:820px;margin-top:16px}.form label{display:grid;gap:6px;color:var(--muted);font-weight:600}.form label small{font-size:12px;font-weight:400}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea,select{background:#091625;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:11px;width:100%;outline:none}input:focus,textarea:focus,select:focus{border-color:#6ca8df;box-shadow:0 0 0 2px #6ca8df24}textarea{min-height:130px;resize:vertical}.checklabel{display:flex!important;align-items:center;gap:8px}.checklabel input{width:auto}.headingrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.headingrow h2{margin:0}.ticket-card{padding:13px;border:1px solid var(--border);background:#14283f;border-radius:12px;margin:10px 0}.ticket-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.ticket-head small,.faq-admin small{display:block;color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.actions button,.actions select{width:auto}.status{display:inline-block;border-radius:99px;background:#284767;padding:5px 10px;font-size:12px;white-space:nowrap}.status.open{background:#224968}.status.in_progress{background:#705222}.status.waiting_user{background:#59427b}.status.resolved{background:#225b4a}.status.closed{background:#3d4858}.messages{display:grid;gap:10px;margin:20px 0}.message{padding:14px;border-radius:12px;border:1px solid var(--border);background:#14283f}.message.staff{background:#1b304a;border-color:#496a8b}.message-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:9px}.message-meta time{font-size:12px;color:var(--muted)}.staffbadge{background:#2c4c6b;border-radius:99px;padding:2px 7px;font-size:11px}.replyform{border-top:1px solid var(--border);padding-top:15px}.back{margin-bottom:1 th:520px){.topbar{padding:9px;gap:8px}.brand span{display:none}.nav button{padding:7px 9px;font-size:12px}.navico{width:22px;height:22px}.account{width:100%;justify-content:flex-start}.quickgrid{grid-template-columns:1fr}.leftside,.rightside{grid-template-columns:1fr 1fr}.ticket-head{flex-direction:column}.hero h1{font-size:20px}.contentcard h2{font-size:19px}}

<div id="app"><div class="loading">BetaForum wordt geladen…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{"use strict";
const URL="https://efqnlbhrtofkjmxfbcck.supabase.co",KEY="sb_publishable_-Qsc8zliUquGK6GXm511sw_IBQ4ikrU";
const db=window.supabase.createClient(URL,KEY),root=document.getElementById("app");
let session=null,isStaff=false,page="home",ticketId=null,faqSearch="",notice="",busy=false,adminText="",adminStatus="",heightObserver=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl=v=>esc(v).replace(/\n/g,"<br>");
const statuses={open:"Open",in_progress:"In behandeling",waiting_user:"Wacht op gebruiker",resolved:"Opgelost",closed:"Gesloten"};
const categories=["Forumfouten & Bugs","Account","Autorisaties","Leerlingenkamer","Forumwinkel & Galjoenen","Donatiesysteem","Klachten","Roep een Modje","Overige Support","Sorteerhoed"];
const categoryDescriptions={"Forumfouten & Bugs":"Fouten, bugs en technische problemen.","Account":"Account-, profiel- en inlogproblemen.","Autorisaties":"Rechten, toegang en autorisaties.","Leerlingenkamer":"Vragen en problemen rond de leerlingenkamer.","Forumwinkel & Galjoenen":"Forumwinkel, galjoenen en aankopen.","Donatiesysteem":"Donaties en problemen met het donatiesysteem.","Klachten":"Klachten of meldingen die zorgvuldig behandeld moeten worden.","Roep een Modje":"Vraag hulp van een moderator.","Overige Support":"Supportvragen die niet bij een andere categorie passen.","Sorteerhoed":"Sorteerhoed- en afdelingsaanvragen."};
const categoryLinks={"Forumfouten & Bugs":"https://testforumjoost.forumactie.com/f36-forumfouten-bugs-support","Account":"https://testforumjoost.forumactie.com/f14-account-support","Autorisaties":"https://testforumjoost.forumactie.com/f11-autorisaties-support","Leerlingenkamer":"https://testforumjoost.forumactie.com/f13-leerlingenkamer-support","Forumwinkel & Galjoenen":"https://testforumjoost.forumactie.com/f17-forumwinkel-galjoenen-support","Donatiesysteem":"https://testforumjoost.forumactie.com/f15-donatiesysteem-support","Klachten":"https://testforumjoost.forumactie.com/f18-klachten-support","Roep een Modje":"https://testforumjoost.forumactie.com/f16-roep-een-modje-support","Overige Support":"https://testforumjoost.forumactie.com/f37-overige-support","Sorteerhoed":"https://testforumjoost.forumactie.com/h13-dev-sorting-hat","Roep een modje":"https://testforumjoost.forumactie.com/f16-roep-een-modje-support"};
let forumIdentity={username:"",userId:"",loggedIn:false};
function readForumotionIdentity(){
 const u=window._userdata||{};
 const name=String(u.username||"").trim(),id=String(u.user_id||"").trim();
 return {username:name.slice(0,80),userId:id.slice(0,40),loggedIn:Number(u.session_logged_in)>0&&!!name&&!!id&&id!=="-1"};
}
async function resolveForumotionIdentity(){
 forumIdentity=readForumotionIdentity();
 if(forumIdentity.loggedIn)return forumIdentity;
 try{
  const response=await fetch("/",{method:"GET",credentials:"same-origin",cache:"no-store"});
  if(!response.ok)throw new Error("Forumotion-status niet beschikbaar ("+response.status+")");
  const html=await response.text();
  const doc=new DOMParser().parseFromString(html,"text/html");
  const logout=doc.querySelector('a#logout, a[href*="logout"], a[href*="log_out"], #logout');
  if(!logout){forumIdentity={username:"",userId:"",loggedIn:false};return forumIdentity;}
  const profile=doc.querySelector('a[href^="/u"], a[href*="/u"]');
  let userId="",username="";
  if(profile){
   const m=(profile.getAttribute("href")||"").match(/(?:^|\/)u(\d+)(?:[/?#]|$)/);
   if(m)userId=m[1];
   username=(profile.textContent||"").trim();
  }
  const title=doc.querySelector("#fa_welcome, .welcome, #username, .username");
  if(!username&&title)username=(title.textContent||"").replace(/welkom|welcome/ig,"").trim();
  forumIdentity={username:username.slice(0,80)||"Forumlid",userId:userId.slice(0,40),loggedIn:true};
 }catch(e){console.warn("Forumotion-logincontrole mislukt",e);forumIdentity={username:"",userId:"",loggedIn:false};}
 return forumIdentity;
}
const img={logo:"https://i44.servimg.com/u/f44/11/48/74/42/normaa10.png",forum:"https://i44.servimg.com/u/f44/11/48/74/42/hetfor11.png",mod:"https://i44.servimg.com/u/f44/11/48/74/42/modtea10.png",vac:"https://raw.githubusercontent.com/slytherin01/muggle-ministry/betaforum-release-candidate/portal/images/vacatures.png",awards:"https://i44.servimg.com/u/f44/11/48/74/42/awards10.png"};
const toast=s=>{notice=s;setTimeout(()=>{notice="";render()},4500)};
async function init(){try{await resolveForumotionIdentity();let result=await Promise.race([db.auth.getSession(),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Supabase reageert niet binnen 12 seconden.")),12000))]);let {data,error}=result;if(error)throw error;session=data.session;await checkStaff();render();db.auth.onAuthStateChange((_event,s)=>{session=s;setTimeout(async()=>{await checkStaff();render()},0)});}catch(e){root.innerHTML=errorBox("Starten mislukt",e.message||"Onbekende fout");postHeight()}}
async function checkStaff(){isStaff=false;if(!session)return;const {data,error}=await db.from("betaforum_admins").select("role").eq("user_id",session.user.id).maybeSingle();if(error)console.warn("Staff check",error);isStaff=!!data}
function iconMarkup(icon){const map={"⌂":"https://raw.githubusercontent.com/slytherin01/muggle-ministry/betaforum-release-candidate/portal/images/banner.png","▤":"https://raw.githubusercontent.com/slytherin01/muggle-ministry/betaforum-release-candidate/portal/images/het-forum.png","📰":"https://raw.githubusercontent.com/slytherin01/muggle-ministry/betaforum-release-candidate/portal/images/vacatures.png","?":"https://raw.githubusercontent.com/slytherin01/muggle-ministry/betaforum-release-candidate/portal/images/sorteerhoed.png","▣":"https://raw.githubusercontent.com/slytherin01/muggle-ministry/betaforum-release-candidate/portal/images/ongesorteerd.png","✉":"https://raw.githubusercontent.com/slytherin01/muggle-ministry/betaforum-release-candidate/portal/images/het-forum.png","⚙":"https://raw.githubusercontent.com/slytherin01/muggle-ministry/betaforum-release-candidate/portal/images/het-forum.png","🎫":"https://raw.githubusercontent.com/slytherin01/muggle-ministry/betaforum-release-candidate/portal/images/sorteerhoed.png","✉️":"https://raw.githubusercontent.com/slytherin01/muggle-ministry/betaforum-release-candidate/portal/images/het-forum.png","❔":"https://raw.githubusercontent.com/slytherin01/muggle-ministry/betaforum-release-candidate/portal/images/sorteerhoed.png","🧰":"https://raw.githubusercontent.com/slytherin01/muggle-ministry/betaforum-release-candidate/portal/images/het-forum.png","🛡️":"https://raw.githubusercontent.com/slytherin01/muggle-ministry/betaforum-release-candidate/portal/images/het-forum.png"};const src=map[icon]||map["?"];return '<img src="'+src+'" alt="" loading="lazy">';}
function nav(){const links=[["home","Dashboard","⌂"],["systems","Systemen","▤"],["news","Nieuws","📰"],["faq","FAQ","?"],["support","Ticket Support","▣"],["tickets","Mijn tickets","✉"],...(isStaff?[["admin","Ticketbeheer","⚙"]]:[])];return `<header class="topbar"><a class="brand" href="#" onclick="BF.go('home');return false;"><img src="${img.logo}" alt="BetaForum"><span>BetaForum</span></a><nav class="nav">${links.map(([p,label,ico])=>`<button class="${page===p?"active":""}" onclick="BF.go('${p}')"><span class="navico">${iconMarkup(ico)}</span>${label}${p==="tickets"&&session?'<span class="navdot">●</span>':""}</button>`).join("")}</nav><div class="account">${forumIdentity.loggedIn?`<span class="userchip"><small>FORUMOTION INGELOGD</small><b>${esc(forumIdentity.username)}</b></span>`:""}${session?`<button onclick="BF.logout()">BetaForum uitloggen</button>`:`<button onclick="BF.go('login')">Ticketaccount inloggen</button>`}</div></header>`}
function widget(title,content){return `<section class="widget"><h3>${title}</h3><div class="widget-content">${content}</div></section>`}
function layout(content){return nav()+`<div class="portal-grid"><aside class="leftside">${widget("Mijn afdeling",'<a class="department" href="#"><img src="https://raw.githubusercontent.com/slytherin01/muggle-ministry/betaforum-release-candidate/portal/images/ongesorteerd.png" alt="Afdelingswapen"><small>Afdelingsinformatie</small></a>')}${widget("Het forum",`<a href="https://testforumjoost.forumactie.com/" target="_blank" rel="noopener"><img src="${img.forum}" alt="Het Forum"></a>`)}${widget("Modteam",`<a href="https://testforumjoost.forumactie.com/" target="_blank" rel="noopener"><img src="${img.mod}" alt="Het Modteam"></a>`)}</aside><main class="maincol">${content}</main><aside class="rightside">${widget("Vacatures",`<a href="https://testforumjoost.forumactie.com/" target="_blank" rel="noopener"><img src="${img.vac}" alt="Vacatures"></a>`)}${widget("Awards",`<a href="https://testforumjoost.forumactie.com/" target="_blank" rel="noopener"><img src="${img.awards}" alt="Awards"></a>`)}</aside></div><footer class="footer">© 2026 BetaForum · Beta 1.0 · Host: Actieforum.com · Officiële fancommunity · Alle rechten voorbehouden</footer>`}
function hero(title,sub){return `<section class="hero"><img src="${img.logo}" alt="Ministerie logo" class="hero-logo"><h1>${title}</h1><p>${sub}</p></section>`}
function home(){return hero("Welkom bij BetaForum","Het centrale portaal voor vragen, ondersteuning en informatie.")+`<section class="quickgrid">${tile("support","🎫","Ticket Support","Nieuwe supportvraag indienen")}${tile("tickets","✉️","Mijn tickets","Eigen tickets en reacties")}${tile("faq","❔","FAQ","Veelgestelde vragen")}${isStaff?tile("admin","🛡️","Ticketbeheer","Tickets beheren, status en reacties"):""}${tile("news","📰","Nieuwsberichten","Nieuwsfeed en aankondigingen")}${tile("systems","🧰","Alle systemen","Overzicht van portaalonderdelen")}</section><section class="section"><header><h3>Community links</h3><span class="tag">COMMUNITY</span></header><div class="section-body communitygrid"><a class="tile" href="https://testforumjoost.forumactie.com/" target="_blank"><span class="ico">💬</span><span><b>Forum</b><small>Ga naar het forum</small></span></a><a class="tile" href="https://testforumjoost.forumactie.com/" target="_blank"><span class="ico">📜</span><span><b>Reglement</b><small>Bekijk de communityregels</small></span></a><a class="tile" href="https://testforumjoost.forumactie.com/" target="_blank"><span class="ico">📰</span><span><b>Community nieuws</b><small>Lees nieuws uit de community</small></span></a></div></section><section class="section"><header><h3>Nieuws</h3><span class="tag">NIEUWSSYSTEEM</span></header><div class="section-body"><b>Het nieuwssysteem komt hier</b><p class="muted">Nieuws en aankondigingen verschijnen hier zodra het systeem is gekoppeld.</p></div></section>`}
function news(){return `<section class="contentcard"><h2>Nieuwsberichten</h2><p class="muted">Nieuws en aankondigingen van het Ministerie.</p><div class="empty"><b>Nieuwsfeed is nog niet gekoppeld</b><p>Deze pagina werkt en blijft beschikbaar. Zodra het nieuwssysteem wordt gekoppeld, verschijnen berichten hier.</p></div></section>`}
function systems(){return `<section class="contentcard"><h2>Alle systemen</h2><p class="muted">Snel naar de onderdelen van BetaForum en het forum.</p><div class="quickgrid">${tile("support","🎫","Ticket Support","Een nieuwe supportvraag indienen")}${tile("tickets","✉️","Mijn tickets","Je eigen tickets en reacties")}${tile("faq","❔","FAQ","Veelgestelde vragen")}${isStaff?tile("admin","🛡️","Ticketbeheer","Tickets beheren en beantwoorden"):""}${tile("news","📰","Nieuws","Nieuws en aankondigingen")}</div><section class="section"><header><h3>Forum supportcategorieën</h3></header><div class="section-body">${categories.map(c=>`<a class="category-link" style="margin:5px" href="${categoryLinks[c]}" target="_blank" rel="noopener">${esc(c)} ↗</a>`).join("")}</div></section></section>`}
function tile(p,icon,title,desc){return '<button class="tile" onclick="BF.go(\''+p+'\')"><span class="ico">'+iconMarkup(icon)+'</span><span><b>'+title+'</b><small>'+desc+'</small></span></button>'}
function formAuth(register){return `<section class="contentcard narrow"><h2>${register?"Account aanmaken":"Inloggen"}</h2><p class="muted">BetaForum gebruikt een eigen account voor tickets en support.</p><form class="form" onsubmit="BF.auth(event,${register})"><label>E-mailadres<input type="email" name="email" autocomplete="email" required></label><label>Wachtwoord<input type="password" name="password" minlength="8" autocomplete="${register?"new-password":"current-password"}" required></label><button class="primary" type="submit">${register?"Registreren":"Inloggen"}</button></form><p>${register?"Al een account?":"Nog geen account?"} <a onclick="BF.go('${register?"login":"register"}')">${register?"Log in":"Maak account aan"}</a></p></section>`}
function promptLogin(){return `<div class="contentcard"><h2>Inloggen vereist</h2><p>Log in om tickets aan te maken en je gesprekken te bekijken.</p><div class="actions"><button class="primary" onclick="BF.go('login')">Inloggen</button><button onclick="BF.go('register')">Account aanmaken</button></div></div>`}
function categoryPreview(name){return `<div class="category-preview"><b>${esc(name)}</b><p>${esc(categoryDescriptions[name]||"Kies deze categorie voor je supportvraag.")}</p><a class="category-link" href="${categoryLinks[name]||"#"}" target="_blank" rel="noopener">Bekijk forumcategorie ↗</a></div>`}
function support(){if(!session)return promptLogin();return `<section class="contentcard"><h2>Ticket Support</h2><p class="muted">Kies de juiste afdeling. Vul je vraag zo duidelijk mogelijk in; je kunt daarna in hetzelfde ticket verder reageren.</p><form class="form" onsubmit="BF.createTicket(event)"><label>Supportcategorie<select name="category" required onchange="BF.categoryLink(this.value)">${categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></label><div class="forum-identity" id="forum-identity">${forumIdentity.username?`Forumaccount herkend: <b>${esc(forumIdentity.username)}</b>`:"Forumaccount wordt automatisch herkend als je het portaal via het forum opent."}</div><div id="category-link-preview">${categoryPreview(categories[0])}</div><label>Onderwerp<input name="subject" maxlength="120" minlength="3" required></label><label>Bericht<textarea name="body" maxlength="8000" minlength="10" required placeholder="Beschrijf je vraag of probleem…"></textarea><small>Minimaal 10 tekens, maximaal 8000.</small></label><button class="primary" type="submit" ${busy?"disabled":""}>Ticket indienen</button></form></section>`}
async function tickets(){if(!session)return promptLogin();const {data,error}=await db.from("betaforum_tickets").select("id,subject,category,status,created_at,updated_at").eq("user_id",session.user.id).order("updated_at",{ascending:false});if(error)return errorBox("Tickets laden mislukt",error.message);return `<section class="contentcard"><div class="headingrow"><div><h2>Mijn tickets</h2><p class="muted">Je tickets en supportreacties.</p></div><button class="primary" onclick="BF.go('support')">＋ Nieuw ticket</button></div>${data?.length?data.map(t=>ticketCard(t,false)).join(""):empty("Je hebt nog geen tickets.","Start een supportaanvraag.")}</section>`}
function ticketCard(t,adminMode){return `<article class="ticket-card"><div class="ticket-head"><div><b>${esc(t.subject)}</b><small>${esc(t.category||"")} · ${new Date(t.created_at).toLocaleString("nl-NL")}${adminMode?" · "+esc(t.forumotion_username||"Gebruiker"):""}</small></div><span class="status ${esc(t.status)}">${esc(statuses[t.status]||t.status)}</span></div><div class="actions"><button onclick="BF.openTicket('${t.id}')">Bekijk gesprek</button>${categoryLinks[t.category]?'<a class="category-link" href="'+categoryLinks[t.category]+'" target="_blank" rel="noopener">Forumcategorie ↗</a>':''}${adminMode?`<select aria-label="Status wijzigen" onchange="BF.setStatus('${t.id}',this.value)"><option value="">Status wijzigen…</option>${Object.entries(statuses).map(([s,n])=>`<option value="${s}" ${s===t.status?"selected":""}>${n}</option>`).join("")}</select>`:""}</div></article>`}
async function detail(){if(!session)return promptLogin();const {data:t,error}=await db.from("betaforum_tickets").select("*").eq("id",ticketId).single();if(error)return errorBox("Ticket openen mislukt",error.message);const {data:msgs,error:me}=await db.from("betaforum_ticket_messages").select("*").eq("ticket_id",ticketId).order("created_at",{ascending:true});if(me)return errorBox("Berichten laden mislukt",me.message);return `<section class="contentcard"><button class="back" onclick="BF.go('${isStaff?"admin":"tickets"}')">← Terug</button><div class="headingrow"><div><h2>${esc(t.subject)}</h2><p class="muted">${esc(t.category)} · aangemaakt ${new Date(t.created_at).toLocaleString("nl-NL")}</p>${categoryLinks[t.category]?`<a class="category-link" href="${categoryLinks[t.category]}" target="_blank" rel="noopener">Open Forumotion supportcategorie ↗</a>`:""}</div><span class="status ${esc(t.status)}">${esc(statuses[t.status]||t.status)}</span></div>${isStaff&&t.forumotion_username?`<p class="muted">Forumgebruiker: ${esc(t.forumotion_username)} ${t.forumotion_user_id?"("+esc(t.forumotion_user_id)+")":""}</p>`:""}<div class="messages">${msgs?.map(m=>`<article class="message ${m.is_staff?"staff":""}"><div class="message-meta"><b>${esc(m.author_name)} ${m.is_staff?'<span class="staffbadge">Support</span>':""}</b><time>${new Date(m.created_at).toLocaleString("nl-NL")}</time></div><div>${nl(m.body)}</div></article>`).join("")||""}</div>${t.status==="closed"?'<div class="notice">Dit ticket is gesloten.</div>':`<form class="form replyform" onsubmit="BF.reply(event,'${t.id}')"><label>Jouw reactie<textarea name="body" minlength="1" maxlength="8000" required></textarea></label><button class="primary" type="submit">Reactie versturen</button></form>`}</section>`}
async function faq(){const {data,error}=await db.from("betaforum_faq").select("*").eq("is_published",true).order("sort_order").order("created_at");if(error)return errorBox("FAQ laden mislukt",error.message);let list=data||[];if(faqSearch.trim()){const s=faqSearch.toLowerCase();list=list.filter(x=>(x.question+" "+x.answer+" "+x.category).toLowerCase().includes(s))}return `<section class="contentcard"><h2>Veelgestelde vragen</h2><p class="muted">Zoek in de antwoorden of blader door de FAQ.</p><input class="search" placeholder="Zoeken in FAQ…" value="${esc(faqSearch)}" oninput="BF.searchFAQ(this.value)"><div class="faq-list">${list.length?list.map(f=>`<details class="faqitem"><summary>${esc(f.question)}<span>${esc(f.category||"Algemeen")}</span></summary><div>${nl(f.answer)}</div></details>`).join(""):empty("Geen resultaten","Probeer een andere zoekterm.")}</div></section>`}
async function admin(){if(!isStaff)return `<section class="contentcard"><h2>Beheer</h2><p>Je account heeft geen beheerrechten.</p></section>`;const {data:t,error}=await db.from("betaforum_tickets").select("*").order("updated_at",{ascending:false});if(error)return errorBox("Ticketbeheer laden mislukt",error.message);const {data:f,error:fe}=await db.from("betaforum_faq").select("*").order("sort_order").order("created_at");if(fe)return errorBox("FAQ beheer laden mislukt",fe.message);return `<section class="contentcard"><div class="headingrow"><div><h2>Ticketbeheer</h2><p class="muted">Alle supporttickets beheren en beantwoorden.</p></div><span class="tag">${t?.length||0} tickets</span></div><div class="adminfilters"><input placeholder="Zoek ticket…" oninput="BF.filterTickets(this.value)"><select onchange="BF.filterStatus(this.value)"><option value="">Alle statussen</option>${Object.entries(statuses).map(([s,n])=>`<option value="${s}">${n}</option>`).join("")}</select></div><div id="admin-ticket-list">${t?.map(x=>ticketCard(x,true)).join("")||empty("Geen tickets","")}</div></section><section class="section"><header><h3>FAQ beheren</h3><span class="tag">CONTENT</span></header><div class="section-body"><form class="form faqform" onsubmit="BF.createFAQ(event)"><label>Vraag<input name="question" maxlength="300" required></label><label>Antwoord<textarea name="answer" maxlength="8000" required></textarea></label><div class="formrow"><label>Categorie<input name="category" value="Algemeen" maxlength="80"></label><label>Sortering<input name="sort_order" type="number" value="0"></label></div><label class="checklabel"><input name="published" type="checkbox" checked> Direct publiceren</label><button class="primary">FAQ toevoegen</button></form><div class="faqadmin-list">${f?.map(x=>`<article class="faq-admin"><div><b>${esc(x.question)}</b><small>${esc(x.category||"Algemeen")} · ${x.is_published?"Gepubliceerd":"Concept"}</small></div><div class="actions"><button onclick="BF.editFAQ('${x.id}')">Bewerken</button><button onclick="BF.toggleFAQ('${x.id}',${!x.is_published})">${x.is_published?"Verbergen":"Publiceren"}</button><button class="danger" onclick="BF.deleteFAQ('${x.id}')">Verwijderen</button></div><div id="edit-${x.id}"></div></article>`).join("")||empty("Nog geen FAQ-items","Voeg hierboven een vraag toe.")}</div></div></section>`}
function applyAdminFilters(){document.querySelectorAll("#admin-ticket-list .ticket-card").forEach(card=>{const textMatch=card.innerText.toLowerCase().includes(adminText.toLowerCase());const statusMatch=!adminStatus||card.querySelector(".status")?.classList.contains(adminStatus);card.style.display=textMatch&&statusMatch?"":"none"})}
function postHeight(){if(window.parent!==window)window.parent.postMessage({type:"betaforum-height",height:document.documentElement.scrollHeight},"*")}
function empty(title,sub){return `<div class="empty"><b>${title}</b><p>${sub||""}</p></div>`}function errorBox(title,msg){return `<div class="error"><b>${esc(title)}</b><p>${esc(msg||"Onbekende fout")}</p><button onclick="BF.go('home')">Terug naar dashboard</button></div>`}
async function render(){if(!root)return;let content;try{switch(page){case"home":content=home();break;case"login":content=formAuth(false);break;case"register":content=formAuth(true);break;case"systems":content=systems();break;case"news":content=news();break;case"faq":content=await faq();break;case"support":content=support();break;case"tickets":content=await tickets();break;case"admin":content=await admin();break;case"detail":content=await detail();break;default:content=home();}}catch(e){content=errorBox("Pagina laden mislukt",e.message)}root.innerHTML=layout(content);if(notice)root.insertAdjacentHTML("afterbegin",`<div class="toast">${esc(notice)}</div>`);if(heightObserver)heightObserver.disconnect();if(window.ResizeObserver){heightObserver=new ResizeObserver(postHeight);heightObserver.observe(root)}root.querySelectorAll("img").forEach(i=>i.addEventListener("load",postHeight,{once:true}));postHeight()}
window.addEventListener("message",event=>{if(event.source!==window.parent)return;let host="";try{host=new URL(event.origin).hostname}catch(e){return}if(!host.endsWith(".forumactie.com")&&!host.endsWith(".forumactif.com")&&host!=="forumactif.com")return;if(event.origin!=="https://testforumjoost.forumactie.com")return;const d=event.data;if(!d||d.type!=="betaforum-forum-identity")return;forumIdentity={username:String(d.username||"").slice(0,80),userId:String(d.userId||"").slice(0,40)};render();});
window.BF={categoryLink:name=>{const box=document.getElementById("category-link-preview");if(box)box.innerHTML=categoryPreview(name);},go:p=>{page=p;render()},logout:async()=>{await db.auth.signOut();session=null;isStaff=false;page="home";render()},auth:async(e,reg)=>{e.preventDefault();const f=new FormData(e.target);const result=reg?await db.auth.signUp({email:f.get("email"),password:f.get("password")}):await db.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});if(result.error){toast(result.error.message);return}session=result.data.session;await checkStaff();if(reg&&!session){toast("Registratie gelukt. Controleer je e-mail om je account te bevestigen.");page="login"}else{page="home";toast("Welkom bij BetaForum!")}render()},createTicket:async e=>{e.preventDefault();if(busy)return;busy=true;const f=new FormData(e.target);const {data,error}=await db.rpc("betaforum_create_ticket",{p_category:f.get("category"),p_subject:f.get("subject"),p_body:f.get("body"),p_forumotion_user_id:forumIdentity.userId||null,p_forumotion_username:forumIdentity.username||null});busy=false;if(error){toast(error.message);render();return}ticketId=data;page="detail";toast("Ticket aangemaakt. Support kan nu reageren.");render()},openTicket:id=>{ticketId=id;page="detail";render()},reply:async(e,id)=>{e.preventDefault();const f=new FormData(e.target);const body=String(f.get("body")||"").trim();if(!body)return;const {error}=await db.from("betaforum_ticket_messages").insert({ticket_id:id,author_user_id:session.user.id,author_name:forumIdentity.username||session.user.email,is_staff:isStaff,body});if(error){toast(error.message);return}toast("Reactie verstuurd.");render()},setStatus:async(id,s)=>{if(!s)return;const {error}=await db.from("betaforum_tickets").update({status:s,closed_at:s==="closed"?new Date().toISOString():null}).eq("id",id);if(error)toast(error.message);else toast("Ticketstatus bijgewerkt.");render()},searchFAQ:v=>{faqSearch=v;const list=document.querySelector(".faq-list");if(!list)return;let count=0;list.querySelectorAll(".faqitem").forEach(item=>{const show=item.innerText.toLowerCase().includes(v.toLowerCase());item.style.display=show?"":"none";if(show)count++});let emptyEl=list.querySelector(".faq-search-empty");if(!emptyEl&&list.querySelector(".faqitem")){emptyEl=document.createElement("div");emptyEl.className="faq-search-empty empty";list.appendChild(emptyEl)}if(emptyEl)emptyEl.textContent=v.trim()&&!count?"Geen resultaten. Probeer een andere zoekterm.":""},filterTickets:v=>{adminText=v;applyAdminFilters()},filterStatus:v=>{adminStatus=v;applyAdminFilters()},createFAQ:async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.from("betaforum_faq").insert({question:f.get("question"),answer:f.get("answer"),category:f.get("category")||"Algemeen",sort_order:Number(f.get("sort_order")||0),is_published:f.has("published"),created_by:session.user.id});if(error)toast(error.message);else toast("FAQ-item toegevoegd.");render()},editFAQ:async id=>{const {data,error}=await db.from("betaforum_faq").select("*").eq("id",id).single();if(error){toast(error.message);return}const box=document.getElementById("edit-"+id);box.innerHTML=`<form class="form editfaq" onsubmit="BF.saveFAQ(event,'${id}')"><label>Vraag<input name="question" value="${esc(data.question)}" required></label><label>Antwoord<textarea name="answer" required>${esc(data.answer)}</textarea></label><div class="formrow"><label>Categorie<input name="category" value="${esc(data.category||"Algemeen")}"></label><label>Sortering<input name="sort_order" type="number" value="${data.sort_order||0}"></label></div><div class="actions"><button class="primary">Opslaan</button><button type="button" onclick="document.getElementById('edit-${id}').innerHTML=''">Annuleren</button></div></form>`},saveFAQ:async(e,id)=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.from("betaforum_faq").update({question:f.get("question"),answer:f.get("answer"),category:f.get("category"),sort_order:Number(f.get("sort_order")||0)}).eq("id",id);if(error)toast(error.message);else toast("FAQ bijgewerkt.");render()},toggleFAQ:async(id,p)=>{const {error}=await db.from("betaforum_faq").update({is_published:p}).eq("id",id);if(error)toast(error.message);else toast(p?"FAQ gepubliceerd.":"FAQ verborgen.");render()},deleteFAQ:async id=>{if(!confirm("Dit FAQ-item definitief verwijderen?"))return;const {error}=await db.from("betaforum_faq").delete().eq("id",id);if(error)toast(error.message);else toast("FAQ verwijderd.");render()}};init();
})();
</script>
