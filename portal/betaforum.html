<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BetaForum</title>
<meta name="theme-color" content="#091321">
<link rel="stylesheet" href="./betaforum.css?v=rc-70fda254">
</head>
<body>
<div id="app"><div class="loading">BetaForum wordt geladen…</div></div>
<script>
(function(){
  const root=document.getElementById("app");
  function showError(title,detail){
    root.innerHTML='<section style="margin:16px;padding:24px;border:1px solid #a43b4b;border-radius:12px;background:#25121b;color:#fff;font:16px system-ui"><h2>'+title+'</h2><p>'+detail+'</p><button onclick="location.reload()" style="padding:10px 16px;border-radius:8px;cursor:pointer">Opnieuw laden</button></section>';
  }
  function load(src,ms){return new Promise((resolve,reject)=>{const s=document.createElement("script");s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error("Script kon niet worden geladen: "+src));const timer=setTimeout(()=>{s.remove();reject(new Error("Timeout bij laden: "+src));},ms);s.onload=()=>{clearTimeout(timer);resolve()};s.onerror=()=>{clearTimeout(timer);reject(new Error("Script kon niet worden geladen: "+src));};document.head.appendChild(s);});}
  (async()=>{
    try{
      try{await load("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",9000);}
      catch(e){await load("https://unpkg.com/@supabase/supabase-js@2",9000);}
      if(!window.supabase?.createClient)throw new Error("Supabase-client ontbreekt na het laden.");
      await load("./betaforum.js?v=rc-0e7ef7b",12000);
    }catch(e){showError("BetaForum kon niet starten",e.message+" — controleer internet/CDN-toegang en probeer opnieuw.");}
  })();
})();
</script>
</body>
</html>
